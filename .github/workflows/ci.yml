name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev,llm]'
      - name: Tests (offline, hermetic)
        run: PYTHONPATH=src .venv/bin/python -m pytest -q
      - name: Eval gate (58 cases, hard gates)
        run: PYTHONPATH=src .venv/bin/python -m wealthwise.eval --min-cases 58
      - name: Publish eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: data/evals/report.md
